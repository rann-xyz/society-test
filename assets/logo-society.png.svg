<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#c0c0c0"/>
    </linearGradient>
    <filter id="fabric">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Fabric texture overlay -->
  <rect width="200" height="200" fill="#d0d0d0" opacity="0.3" filter="url(#fabric)"/>
  <!-- S Logo -->
  <path d="M45 35 L115 35 L155 75 L115 115 L55 115 L95 155 L145 155" 
        stroke="#0a0a0a" stroke-width="28" fill="none" 
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 35 L115 35 L155 75 L115 115 L55 115 L95 155 L145 155" 
        stroke="#1a1a1a" stroke-width="24" fill="none" 
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

